name: android-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Enable Gradle wrapper
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest -PQINGKUI_ENV=test
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug -PQINGKUI_ENV=test
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qingkui-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
