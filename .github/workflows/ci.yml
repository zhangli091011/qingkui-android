name: android-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Enable Gradle wrapper
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest -PQINGKUI_ENV=test
      - name: Android Lint
        run: ./gradlew :app:lintDebug -PQINGKUI_ENV=test
      - name: Build production-connected Debug APK
        run: ./gradlew :app:assembleDebug -PQINGKUI_ENV=production
      - name: Verify production API is embedded
        run: grep -F 'https://qingkui-api.82-158-229-157.sslip.io/api/' app/build/generated/source/buildConfig/debug/cn/qingkui/app/BuildConfig.java
      - name: Upload production-connected Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: qingkui-production-connected-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
